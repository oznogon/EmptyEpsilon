# Example hardware configuration for Philips Hue V2 device
#
# Maps ship alert levels to Hue light colors:
#
#   Red alert    -> Red    (brightness=100%, saturation=100%, hue=0)
#   Yellow alert -> Yellow (brightness=100%, saturation=100%, hue=60)
#   No alert     -> White  (brightness=100%, saturation=0%,   hue=0)
#
# Place this file as hardware.ini in your EmptyEpsilon configuration directory.
# Add your Hue V2 bridge's IP address (`ip` below) and API key (`apikey`) to
# the `[hardware]` section of this configuration file before use.
#
# To get the IP address, while connected to the same network as the Bridge, use
# the discovery endpoint: curl -s https://discovery.meethue.com/
#
# To get the API key, press the link button on the Bridge, then within 30
# seconds run:
#
# curl --insecure -X POST https://<BRIDGE_IP>/api \
#     -H "Content-Type: application/json" \
#     -d '{"devicetype":"my_hue_app#device_name","generateclientkey":true}'
#
# The API key is the `username` field in the response.
#
# The `lights` setting lets you pick specific lights by their Hue UUID (`id`).
# To get the IDs of all lights on the Bridge:
#
# curl --insecure -X GET https://<BRIDGE_IP>/clip/v2/resource/light \
#     -H "hue-application-key: <APIKEY>"
#
# Without it, all discovered lights are used (one light = 4 channels).
# Light UUIDs are comma-separated; their order determines the channel layout.
#
# Due to macOS network/firewall restrictions, if you've just installed
# EmptyEpsilon, run it, allow it to connect to devices on the local network,
# then quit and restart EmptyEpsilon. Otherwise the Bridge connection will
# fail during EE's startup and won't be retried.

[hardware]
device = PhilipsHueV2Device
ip = 
apikey = 
# Play only a specified light:
# lights = 
# Or keyfile instead of apikey to store the key in a separate file:
# keyfile = philips_hue_v2.key

# Map global channel indices to names for the first light.
# Each Hue light uses 4 channels: Brightness, Saturation, Hue, Transition Time.
[channel]
channel = 1
name = Light1Brightness

[channel]
channel = 2
name = Light1Saturation

[channel]
channel = 3
name = Light1Hue

[channel]
channel = 4
name = Light1Transition

# Light is always on — only hue and saturation change with alerts.
# Brightness 1.0 across the board keeps the light lit.

# --- Always on ---
[state]
target = Light1Brightness
condition = Always
effect = static
value = 1.0

# --- Red Alert -> Red ---
[state]
target = Light1Saturation
condition = RedAlert>0
effect = static
value = 1.0

[state]
target = Light1Hue
condition = RedAlert>0
effect = static
value = 0.0

# --- Yellow Alert -> Yellow (hue = 60/360) ---
[state]
target = Light1Saturation
condition = YellowAlert>0
effect = static
value = 1.0

[state]
target = Light1Hue
condition = YellowAlert>0
effect = static
value = 0.167

# --- No Alert -> White (saturation = 0, hue irrelevant) ---
[state]
target = Light1Saturation
condition = Alert==0
effect = static
value = 0.0

[state]
target = Light1Hue
condition = Alert==0
effect = static
value = 0.0

# Smooth 0.5s transition between colors
[state]
target = Light1Transition
condition = Always
effect = static
value = 5
